<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c8402e">
<meta name="description" content="ಕನ್ನಡ ಧಾರ್ಮಿಕ ಮತ್ತು ಸಾಂಸ್ಕೃತಿಕ ಕಾರ್ಯಕ್ರಮಗಳ ಕ್ಯಾಲೆಂಡರ್ — ಹಬ್ಬಗಳು, ಜಾತ್ರೆಗಳು, ಮೇಳಗಳು ಮತ್ತು ಸ್ಥಳೀಯ ಕಾರ್ಯಕ್ರಮಗಳು">
<title>ಕನ್ನಡ ಸಾಂಸ್ಕೃತಿಕ ಕ್ಯಾಲೆಂಡರ್ — Kannada Cultural Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@500;700;800&family=Noto+Sans+Kannada:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
</head>
<body>
<div class="app">

  <header class="masthead">
    <button id="prevDay" class="icon-btn" type="button" aria-label="ಹಿಂದಿನ ದಿನ">‹</button>
    <div id="mastheadDateBlock" class="masthead-mid" aria-live="polite">
      <span class="brand">ಕನ್ನಡ ಕಾರ್ಯಕ್ರಮಗಳು</span>
      <span id="mastheadDate" class="masthead-date"></span>
    </div>
    <button id="todayBtn" class="today-btn" type="button">ಇಂದು</button>
    <button id="nextDay" class="icon-btn" type="button" aria-label="ಮುಂದಿನ ದಿನ">›</button>
  </header>

  <main class="main">

    <section id="viewDay" class="view">
      <div id="todayContent"></div>
    </section>

    <section id="viewWeek" class="view" hidden>
      <div id="weekHead" class="period-head" hidden>
        <button id="prevWeek" class="icon-btn" type="button" aria-label="ಹಿಂದಿನ ವಾರ">‹</button>
        <h2 id="weekTitle" class="month-title"></h2>
        <button id="nextWeek" class="icon-btn" type="button" aria-label="ಮುಂದಿನ ವಾರ">›</button>
      </div>
      <div class="toolbar-row stream-toolbar">
        <label for="weekDistrictSelect">ಜಿಲ್ಲೆ</label>
        <select id="weekDistrictSelect" class="district-select" name="weekDistrict"></select>
      </div>
      <div class="scope-legend" aria-label="ಕಾರ್ಯಕ್ರಮದ ವ್ಯಾಪ್ತಿ">
        <span><i class="scope-dot district"></i> ಜಿಲ್ಲಾ ಕಾರ್ಯಕ್ರಮಗಳು</span>
        <span><i class="scope-dot state"></i> ಕರ್ನಾಟಕದ ಕಾರ್ಯಕ್ರಮಗಳು</span>
      </div>
      <div id="weekAgenda" class="week-agenda"></div>
    </section>

    <section id="viewMonth" class="view" hidden>
      <div class="toolbar-row stream-toolbar">
        <label for="monthDistrictSelect">ಜಿಲ್ಲೆ</label>
        <select id="monthDistrictSelect" class="district-select" name="monthDistrict"></select>
      </div>
      <div id="monthScroller" class="month-scroller"></div>
    </section>

    <section id="viewMore" class="view" hidden>
      <h2 class="view-title">ಸೆಟ್ಟಿಂಗ್ಸ್</h2>
      <div class="card settings">
        <label class="setting-row" for="settingsDistrictSelect">
          <span>ಜಿಲ್ಲೆ <small>ಜಿಲ್ಲಾ ಕಾರ್ಯಕ್ರಮಗಳನ್ನು ತೋರಿಸಿ</small></span>
          <select id="settingsDistrictSelect" class="district-select" name="settingsDistrict"></select>
        </label>
        <label class="setting-row" for="fontBig">
          <span>ದೊಡ್ಡ ಅಕ್ಷರ <small>ಹಿರಿಯ ಓದುಗರಿಗೆ ಅನುಕೂಲ</small></span>
          <input type="checkbox" id="fontBig" class="switch">
        </label>
        <label class="setting-row" for="knDigits">
          <span>ಕನ್ನಡ ಅಂಕೆಗಳು <small>೦-೯ ಬದಲಿಗೆ 0-9</small></span>
          <input type="checkbox" id="knDigits" class="switch">
        </label>
      </div>
      <div class="card about">
        <p>ಇದು ಕನ್ನಡ ಧಾರ್ಮಿಕ ಮತ್ತು ಸಾಂಸ್ಕೃತಿಕ ಕಾರ್ಯಕ್ರಮಗಳನ್ನು ದಿನ, ವಾರ ಮತ್ತು ತಿಂಗಳಂತೆ ಹುಡುಕಲು ಸಹಾಯ ಮಾಡುವ ಕ್ಯಾಲೆಂಡರ್.</p>
        <p>ದತ್ತಾಂಶ ಮೂಲ: PV ಕಾರ್ಯಕ್ರಮಗಳ JSON.</p>
      </div>
    </section>

  </main>

  <nav class="tabbar" aria-label="ಮುಖ್ಯ ಟ್ಯಾಬ್ಗಳು">
    <button class="tab is-active" data-tab="day" type="button" aria-current="page">
      <span class="tab-ico" aria-hidden="true">◐</span><span>ಹೋಮ್</span>
    </button>
    <button class="tab" data-tab="week" type="button">
      <span class="tab-ico" aria-hidden="true">☷</span><span>ವಾರ</span>
    </button>
    <button class="tab" data-tab="month" type="button">
      <span class="tab-ico" aria-hidden="true">▦</span><span>ತಿಂಗಳು</span>
    </button>
    <button class="tab" data-tab="more" type="button">
      <span class="tab-ico" aria-hidden="true">⚙</span><span>ಹೆಚ್ಚು</span>
    </button>
  </nav>

</div>
<noscript><p style="padding:1rem">ಈ ಆ್ಯಪ್ JavaScript ಬಳಸುತ್ತದೆ — ದಯವಿಟ್ಟು ಸಕ್ರಿಯಗೊಳಿಸಿ.</p></noscript>
<script src="app.js?v=6"></script>
</body>
</html>
